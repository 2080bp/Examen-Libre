      const [timerActive, setTimerActive] = useState(false);
      const timerRef = useRef(null);

      useEffect(() => {
        if (timerActive) {
          timerRef.current = setInterval(() => setSeconds((s) => s + 1), 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [timerActive]);

      // Hide loading screen once React mounts
      useEffect(() => {
        const el = document.getElementById("loading");
        if (el) el.style.display = "none";
      }, []);

      const formatTime = (s) =>
        `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

      const totalDone = Object.values(completed).reduce((a, b) => a + b, 0);
      const totalEx = SUBJECTS.reduce((a, s) => a + s.topics.reduce((b, t) => b + t.exercises.length, 0), 0);

      function startTopic(topic) {
        setSelectedTopic(topic);
        setCurrentEx(0);
        setRevealed(false);
        setShowHint(false);
        setSeconds(0);
        setTimerActive(true);
        setScreen("exercise");
      }

      function nextExercise() {
        const key = `${selectedSubject.id}_${selectedTopic.id}`;
        setCompleted((c) => ({ ...c, [key]: (c[key] || 0) + 1 }));
        if (currentEx < selectedTopic.exercises.length - 1) {
          setCurrentEx((n) => n + 1);
          setRevealed(false);
          setShowHint(false);
        } else {
          setTimerActive(false);
          setScreen("done");
        }
      }

      const ex = selectedTopic?.exercises[currentEx];
      const progress = selectedTopic ? (currentEx / selectedTopic.exercises.length) * 100 : 0;
      const subj = selectedSubject;

                  return (
                    <button key={s.id} onClick={() => { setSelectedSubject(s); setScreen("subject"); }}
                      style={{ background: s.bg, border: `2px solid ${s.accent}`, borderRadius: 18, padding: "20px 16px", cursor: "pointer", textAlign: "left", transition: "transform 0.15s,box-shadow 0.15s", boxShadow: "0 4px 20px rgba(0,0,0,0.2)" }}
                      onMouseOver={e => e.currentTarget.style.transform = "translateY(-3px)"}
                      onMouseOut={e => e.currentTarget.style.transform = "translateY(0)"}
                    >
                      <div style={{ fontSize: 36, marginBottom: 10 }}>{s.emoji}</div>
                      <div style={{ fontWeight: 900, color: s.color, fontSize: 15, marginBottom: 4 }}>{s.name}</div>
                      <div style={{ fontSize: 12, color: "#6B7280", marginBottom: 10 }}>{s.topics.length} temas · {total} ejercicios</div>
                      <div style={{ height: 6, background: "#E5E7EB", borderRadius: 99, overflow: "hidden" }}>
                        <div style={{ height: "100%", width: `${(done / total) * 100}%`, background: s.color, borderRadius: 99 }} />
                      </div>
                    </button>
                  );
                })}
              </div>

              <div style={{ background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 14, padding: "16px 20px", marginTop: 28, display: "flex", gap: 12, alignItems: "flex-start" }}>
                <span style={{ fontSize: 24 }}>💡</span>
                <div>
                  <div style={{ color: "#fbbf24", fontWeight: 800, fontSize: 14, marginBottom: 4 }}>Consejo para estudiar mejor</div>
                  <div style={{ color: "rgba(255,255,255,0.65)", fontSize: 13, lineHeight: 1.6 }}>Estudia en bloques de <strong style={{ color: "#fff" }}>15–25 minutos</strong> y luego descansa 5 minutos.</div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ── SUBJECT ─────────────────────────────────────────────────────────────
      if (screen === "subject") {
        return (
          <div style={{ minHeight: "100vh", background: "linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e3a5f 100%)", fontFamily: "'Nunito', sans-serif", padding: "0 0 40px" }}>
            <div style={{ background: "rgba(255,255,255,0.08)", backdropFilter: "blur(10px)", padding: "16px 24px", borderBottom: "1px solid rgba(255,255,255,0.12)", display: "flex", alignItems: "center", gap: 14 }}>
              <button onClick={() => setScreen("home")} style={{ background: "rgba(255,255,255,0.15)", border: "none", color: "#fff", borderRadius: 10, padding: "8px 14px", cursor: "pointer", fontSize: 20 }}>←</button>
              <div style={{ fontSize: 32 }}>{subj.emoji}</div>
              <h1 style={{ margin: 0, color: "#fff", fontSize: 22, fontFamily: "'Fredoka One', sans-serif" }}>{subj.name}</h1>
            </div>
            <div style={{ maxWidth: 700, margin: "0 auto", padding: "28px 16px" }}>
              <h3 style={{ color: "rgba(255,255,255,0.5)", fontSize: 12, letterSpacing: 2, textTransform: "uppercase", margin: "0 0 16px" }}>Elige un tema</h3>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                {subj.topics.map((t) => {
                  const done = completed[`${subj.id}_${t.id}`] || 0;
                  const pct = Math.round((done / t.exercises.length) * 100);
                  return (
                    <button key={t.id} onClick={() => { setSelectedTopic(t); setScreen("topic"); }}
                      style={{ background: subj.bg, border: `2px solid ${subj.accent}`, borderRadius: 18, padding: "20px 22px", cursor: "pointer", textAlign: "left", boxShadow: "0 4px 20px rgba(0,0,0,0.15)", transition: "transform 0.15s" }}
                      onMouseOver={e => e.currentTarget.style.transform = "translateY(-2px)"}
                      onMouseOut={e => e.currentTarget.style.transform = "translateY(0)"}
                    >
                      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
                        <span style={{ fontSize: 28 }}>{t.emoji}</span>
                        <div>
                          <div style={{ fontWeight: 900, color: subj.color, fontSize: 16 }}>{t.name}</div>
                          <div style={{ fontSize: 12, color: "#6B7280" }}>{t.exercises.length} ejercicios · {pct}% completado</div>
                        </div>
                        {pct === 100 && <span style={{ marginLeft: "auto", fontSize: 24 }}>✅</span>}
                      </div>
                      <div style={{ background: "#E5E7EB", borderRadius: 99, height: 6, overflow: "hidden" }}>
                        <div style={{ width: `${pct}%`, height: "100%", background: subj.color, borderRadius: 99, transition: "width 0.5s" }} />
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        );
      }

      // ── TOPIC ───────────────────────────────────────────────────────────────
      if (screen === "topic") {
        const t = selectedTopic;
        return (
          <div style={{ minHeight: "100vh", background: "linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e3a5f 100%)", fontFamily: "'Nunito', sans-serif", padding: "0 0 40px" }}>
            <div style={{ background: "rgba(255,255,255,0.08)", backdropFilter: "blur(10px)", padding: "16px 24px", borderBottom: "1px solid rgba(255,255,255,0.12)", display: "flex", alignItems: "center", gap: 14 }}>
              <button onClick={() => setScreen("subject")} style={{ background: "rgba(255,255,255,0.15)", border: "none", color: "#fff", borderRadius: 10, padding: "8px 14px", cursor: "pointer", fontSize: 20 }}>←</button>
              <span style={{ fontSize: 28 }}>{t.emoji}</span>
              <h1 style={{ margin: 0, color: "#fff", fontSize: 20, fontFamily: "'Fredoka One', sans-serif" }}>{t.name}</h1>
            </div>
            <div style={{ maxWidth: 700, margin: "0 auto", padding: "24px 16px" }}>
              <div style={{ background: `linear-gradient(135deg,${subj.color}22,${subj.color}11)`, border: `2px solid ${subj.color}44`, borderRadius: 14, padding: "14px 18px", marginBottom: 20, display: "flex", gap: 10 }}>
                <span style={{ fontSize: 22 }}>💡</span>
                <span style={{ color: "#fff", fontSize: 14, fontWeight: 700 }}>{t.tip}</span>
              </div>
              <div style={{ background: "rgba(255,255,255,0.95)", borderRadius: 18, padding: "24px", marginBottom: 20, boxShadow: "0 8px 30px rgba(0,0,0,0.2)" }}>
                <h3 style={{ margin: "0 0 14px", color: subj.color, fontSize: 17, fontWeight: 900 }}>📖 Explicación</h3>
                {t.explanation.split("\n").map((line, i) => (
                  <p key={i} style={{ margin: "0 0 8px", color: "#374151", fontSize: 14, lineHeight: 1.7 }}>{line}</p>
                ))}
              </div>
              <a href={t.video.url} target="_blank" rel="noopener noreferrer"
                style={{ display: "flex", alignItems: "center", gap: 14, background: "#FF0000", borderRadius: 14, padding: "16px 20px", textDecoration: "none", marginBottom: 28, boxShadow: "0 4px 20px rgba(255,0,0,0.3)" }}>
                <span style={{ fontSize: 32 }}>▶️</span>
                <div>
                  <div style={{ color: "#fff", fontWeight: 900, fontSize: 15 }}>{t.video.label}</div>
                  <div style={{ color: "rgba(255,255,255,0.75)", fontSize: 12 }}>Buscar en YouTube · En español · Abre en nueva pestaña</div>
                </div>
              </a>
              <button onClick={() => startTopic(t)}
                style={{ width: "100%", background: `linear-gradient(135deg,${subj.color},${subj.color}aa)`, border: "none", borderRadius: 16, padding: "18px", color: "#fff", fontSize: 18, fontWeight: 900, cursor: "pointer", boxShadow: `0 6px 25px ${subj.color}55`, fontFamily: "'Nunito', sans-serif" }}>
                ✏️ Comenzar {t.exercises.length} ejercicios
              </button>
            </div>
          </div>
        );
      }

      // ── EXERCISE ────────────────────────────────────────────────────────────
      if (screen === "exercise" && ex) {
        return (
          <div style={{ minHeight: "100vh", background: "linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e3a5f 100%)", fontFamily: "'Nunito', sans-serif", padding: "0 0 40px" }}>
            <div style={{ background: "rgba(255,255,255,0.08)", backdropFilter: "blur(10px)", padding: "14px 20px", borderBottom: "1px solid rgba(255,255,255,0.12)" }}>
              <div style={{ maxWidth: 700, margin: "0 auto", display: "flex", alignItems: "center", gap: 12 }}>
                <button onClick={() => { setScreen("topic"); setTimerActive(false); }} style={{ background: "rgba(255,255,255,0.15)", border: "none", color: "#fff", borderRadius: 10, padding: "8px 12px", cursor: "pointer", fontSize: 18 }}>←</button>
                <span style={{ fontSize: 20 }}>{selectedTopic.emoji}</span>
                <span style={{ color: "#fff", fontWeight: 800, fontSize: 14, flex: 1 }}>{selectedTopic.name}</span>
                <div style={{ background: "rgba(255,255,255,0.15)", borderRadius: 10, padding: "6px 12px", color: "#fbbf24", fontWeight: 900, fontSize: 15, fontFamily: "monospace" }}>⏱ {formatTime(seconds)}</div>
              </div>
            </div>
            <div style={{ maxWidth: 700, margin: "0 auto", padding: "20px 16px" }}>
              <div style={{ marginBottom: 20 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <span style={{ color: "rgba(255,255,255,0.6)", fontSize: 13 }}>Pregunta {currentEx + 1} de {selectedTopic.exercises.length}</span>
                  <span style={{ color: subj.color, fontWeight: 800, fontSize: 13 }}>{Math.round(progress)}% listo</span>
                </div>
                <div style={{ height: 8, background: "rgba(255,255,255,0.15)", borderRadius: 99, overflow: "hidden" }}>
                  <div style={{ height: "100%", width: `${progress}%`, background: `linear-gradient(90deg,${subj.color},${subj.color}aa)`, borderRadius: 99, transition: "width 0.5s" }} />
                </div>
              </div>
              <div style={{ background: "rgba(251,191,36,0.12)", border: "1px solid rgba(251,191,36,0.3)", borderRadius: 12, padding: "10px 16px", marginBottom: 20, display: "flex", gap: 10, alignItems: "center" }}>
                <span style={{ fontSize: 20 }}>🐢</span>
                <span style={{ color: "#fbbf24", fontSize: 13, fontWeight: 700 }}>Tómate el tiempo que necesites. No hay apuro. Piensa con calma.</span>
              </div>
              <div style={{ background: "#fff", borderRadius: 20, padding: "28px 24px", marginBottom: 18, boxShadow: "0 10px 40px rgba(0,0,0,0.25)" }}>
                <div style={{ color: subj.color, fontSize: 12, fontWeight: 800, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>Ejercicio {currentEx + 1}</div>
                <p style={{ margin: 0, color: "#111827", fontSize: 18, fontWeight: 800, lineHeight: 1.5 }}>{ex.q}</p>
              </div>
              {!showHint ? (
                <button onClick={() => setShowHint(true)} style={{ width: "100%", background: "rgba(255,255,255,0.08)", border: "2px dashed rgba(255,255,255,0.25)", borderRadius: 14, padding: "14px", color: "rgba(255,255,255,0.7)", fontSize: 14, fontWeight: 700, cursor: "pointer", marginBottom: 12, fontFamily: "'Nunito', sans-serif" }}>
                  🤔 Ver pista (si la necesitas)
                </button>
              ) : (
                <div style={{ background: "rgba(251,191,36,0.15)", border: "2px solid rgba(251,191,36,0.4)", borderRadius: 14, padding: "16px 18px", marginBottom: 12, display: "flex", gap: 10 }}>
                  <span style={{ fontSize: 22 }}>💡</span>
                  <span style={{ color: "#fbbf24", fontSize: 14, lineHeight: 1.6 }}>{ex.hint}</span>
                </div>
              )}
              {!revealed ? (
                <button onClick={() => setRevealed(true)} style={{ width: "100%", background: `linear-gradient(135deg,${subj.color},${subj.color}bb)`, border: "none", borderRadius: 16, padding: "18px", color: "#fff", fontSize: 16, fontWeight: 900, cursor: "pointer", marginBottom: 14, fontFamily: "'Nunito', sans-serif", boxShadow: `0 6px 25px ${subj.color}44` }}>
                  👁 Ver respuesta
                </button>
              ) : (
                <>
                  <div style={{ background: "linear-gradient(135deg,#10B981,#059669)", borderRadius: 16, padding: "20px 22px", marginBottom: 14, boxShadow: "0 6px 25px rgba(16,185,129,0.3)" }}>
                    <div style={{ color: "rgba(255,255,255,0.7)", fontSize: 12, fontWeight: 800, letterSpacing: 1, textTransform: "uppercase", marginBottom: 8 }}>✅ Respuesta correcta</div>
                    <p style={{ margin: 0, color: "#fff", fontSize: 17, fontWeight: 900, lineHeight: 1.5 }}>{ex.a}</p>
                  </div>
                  <button onClick={nextExercise} style={{ width: "100%", background: currentEx < selectedTopic.exercises.length - 1 ? "linear-gradient(135deg,#8B5CF6,#6D28D9)" : "linear-gradient(135deg,#F59E0B,#D97706)", border: "none", borderRadius: 16, padding: "18px", color: "#fff", fontSize: 16, fontWeight: 900, cursor: "pointer", fontFamily: "'Nunito', sans-serif", boxShadow: "0 6px 25px rgba(139,92,246,0.4)" }}>
                    {currentEx < selectedTopic.exercises.length - 1 ? "➡️ Siguiente ejercicio" : "🎉 ¡Terminé el tema!"}
                  </button>
                </>
              )}
            </div>
          </div>
        );
      }

      // ── DONE ────────────────────────────────────────────────────────────────
      if (screen === "done") {
        return (
          <div style={{ minHeight: "100vh", background: "linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e3a5f 100%)", fontFamily: "'Nunito', sans-serif", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
            <div style={{ textAlign: "center", maxWidth: 400 }}>
              <div style={{ fontSize: 80, marginBottom: 20 }}>🏆</div>
              <h1 style={{ color: "#fbbf24", fontFamily: "'Fredoka One', sans-serif", fontSize: 32, margin: "0 0 12px" }}>¡Excelente!</h1>
              <p style={{ color: "rgba(255,255,255,0.8)", fontSize: 16, lineHeight: 1.6, marginBottom: 8 }}>
                Completaste <strong style={{ color: "#fff" }}>{selectedTopic?.name}</strong>
              </p>
              <p style={{ color: "rgba(255,255,255,0.6)", fontSize: 14, marginBottom: 30 }}>
                Tiempo empleado: <strong style={{ color: "#fbbf24" }}>{formatTime(seconds)}</strong>
              </p>
              <div style={{ display: "flex", gap: 14, flexDirection: "column" }}>
                <button onClick={() => { setScreen("subject"); setTimerActive(false); }} style={{ background: `linear-gradient(135deg,${subj.color},${subj.color}aa)`, border: "none", borderRadius: 14, padding: "16px", color: "#fff", fontSize: 15, fontWeight: 900, cursor: "pointer", fontFamily: "'Nunito', sans-serif" }}>
                  📚 Ver otros temas de {subj.name}
                </button>
                <button onClick={() => { setScreen("home"); setTimerActive(false); }} style={{ background: "rgba(255,255,255,0.1)", border: "2px solid rgba(255,255,255,0.2)", borderRadius: 14, padding: "16px", color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer", fontFamily: "'Nunito', sans-serif" }}>
                  🏠 Volver al inicio
                </button>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
